# Wayland Environment Variables for Desktop Applications and Toolkits
# Managed by chezmoi

# Firefox: force native Wayland backend
MOZ_ENABLE_WAYLAND=1

# Qt 5 / Qt 6: force native Wayland backend with X11 fallback
QT_QPA_PLATFORM="wayland;xcb"
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
# PassThrough prevents Qt from rounding fractional scale factors (1.25) to integers
QT_SCALE_FACTOR_ROUNDING_POLICY=PassThrough
QT_AUTO_SCREEN_SCALE_FACTOR=1

# GTK 3 / GTK 4: prefer native Wayland backend
GDK_BACKEND="wayland,x11"

# Clutter: native Wayland backend
CLUTTER_BACKEND=wayland

# SDL 2 / SDL 3: native Wayland backend
SDL_VIDEODRIVER=wayland

# Electron / Chromium apps: automatic Wayland detection
ELECTRON_OZONE_PLATFORM_HINT=auto

# Java GUI applications non-reparenting WM support for Sway
_JAVA_AWT_WM_NONREPARENTING=1
