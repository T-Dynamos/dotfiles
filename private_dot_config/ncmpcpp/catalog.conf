visualizer_fifo_path = "/tmp/mpd.fifo"
visualizer_output_name = "my_fifo"
visualizer_sync_interval = "30" 
visualizer_in_stereo = "yes"
visualizer_type = "spectrum"
visualizer_look = ▮▮
system_encoding = "UTF-8"

# Colors
discard_colors_if_item_is_selected = "yes"
header_window_color = "216"
volume_color = "73"
state_line_color = "242"
state_flags_color = "216"
main_window_color = "216"
color1 = "216"
color2 = "216"
#main_window_highlight_color = "red"
progressbar_color = "233"
progressbar_elapsed_color = "216"
statusbar_color = "216"
#active_column_color = "red"

# Bar
song_status_format = "{%a - }{%t - }{%b}"
progressbar_look = "▃▃▃"

# General
header_visibility = "no"
statusbar_visibility = "no"
execute_on_song_change = "~/.ncmpcpp/cover_obs.sh"
visualizer_color = "73,216,251,105,211"
